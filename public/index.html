<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <div id="app"></div>

  <!-- Estrutura geral: menu e area onde as paginas aparecem -->
  <script type="text/x-template" id="tpl-app">
    <div>
      <header class="menu">
        <div class="container">
          <nav>
            <strong>Gerenciador de Tarefas</strong>
            &nbsp;&nbsp;
            <router-link v-if="usuario" :to="{ name: 'inicial' }">Inicial</router-link>
            <router-link v-if="ehAdmin" :to="{ name: 'admin-inicial' }" :class="{ 'router-link-exact-active': $route.path.indexOf('/admin') === 0 }">Admin</router-link>
            <router-link :to="{ name: 'autor' }">Autor</router-link>
          </nav>
          <div class="usuario">
            <template v-if="usuario">
              <span>{{ usuario.email }} ({{ usuario.perfil }})</span>
              <button type="button" @click="sair">Sair</button>
            </template>
            <router-link v-else :to="{ name: 'login' }">Entrar</router-link>
          </div>
        </div>
      </header>
      <main class="container">
        <router-view></router-view>
      </main>
    </div>
  </script>

  <!-- Rota Inicial -->
  <script type="text/x-template" id="tpl-inicial">
    <div>
      <div v-if="erro" class="erro">{{ erro }}</div>

      <div class="card">
        <h3>Nova tarefa</h3>
        <form @submit.prevent="cadastrar">
          <label>Titulo</label>
          <input type="text" v-model="titulo">
          <label>Descricao</label>
          <textarea rows="2" v-model="descricao"></textarea>
          <button type="submit" :disabled="enviando">Adicionar</button>
        </form>
      </div>

      <div class="filtros">
        <button
          v-for="opcao in opcoesFiltro"
          :key="opcao.valor"
          type="button"
          class="claro"
          :class="{ ativo: filtro === opcao.valor }"
          @click="filtrar(opcao.valor)"
        >{{ opcao.rotulo }}</button>
      </div>

      <p v-if="carregando" class="aviso">Carregando tarefas...</p>

      <div v-else-if="tarefas.length === 0" class="card">
        <p>{{ filtro === 'todas' ? 'Nenhuma tarefa cadastrada.' : 'Nenhuma tarefa neste filtro.' }}</p>
      </div>

      <transition-group v-else name="lista" tag="div" class="lista-pai">
        <div v-for="tarefa in tarefas" :key="tarefa.id" class="card">
          <div class="linha-tarefa">
            <div>
              <h3>
                <router-link :to="{ name: 'detalhes', params: { id: tarefa.id } }">{{ tarefa.titulo }}</router-link>
                <span class="tag" :class="tarefa.status">{{ tarefa.status }}</span>
              </h3>
              <p>{{ tarefa.descricao || 'Sem descricao' }}</p>
            </div>
            <button type="button" class="claro" @click="alternar(tarefa)">
              {{ tarefa.status === 'pendente' ? 'Marcar como concluida' : 'Marcar como pendente' }}
            </button>
          </div>
        </div>
      </transition-group>

      <div v-if="totalPaginas > 1" class="paginacao">
        <button type="button" class="claro" :disabled="pagina <= 1" @click="irParaPagina(pagina - 1)">Anterior</button>
        <span>Pagina {{ pagina }} de {{ totalPaginas }} ({{ total }} tarefas)</span>
        <button type="button" class="claro" :disabled="pagina >= totalPaginas" @click="irParaPagina(pagina + 1)">Proxima</button>
      </div>
    </div>
  </script>

  <!-- Rota Detalhes -->
  <script type="text/x-template" id="tpl-detalhes">
    <div>
      <p><router-link :to="{ name: 'inicial' }">Voltar para a lista</router-link></p>

      <div v-if="erro" class="erro">{{ erro }}</div>
      <p v-if="carregando" class="aviso">Carregando...</p>

      <div v-if="tarefa" class="card">
        <h2>{{ tarefa.titulo }} <span class="tag" :class="tarefa.status">{{ tarefa.status }}</span></h2>
        <p><strong>Codigo:</strong> {{ tarefa.id }}</p>
        <p><strong>Descricao:</strong> {{ tarefa.descricao || 'Sem descricao' }}</p>
        <button type="button" @click="alternar">
          {{ tarefa.status === 'pendente' ? 'Marcar como concluida' : 'Marcar como pendente' }}
        </button>
        <button v-if="ehAdmin" type="button" class="perigo" @click="excluir">Excluir</button>
      </div>
    </div>
  </script>

  <!-- Rota Login -->
  <script type="text/x-template" id="tpl-login">
    <div class="card estreito">
      <h2>Entrar</h2>
      <div v-if="erro" class="erro">{{ erro }}</div>
      <form @submit.prevent="entrar">
        <label>E-mail</label>
        <input type="email" v-model="email" required>
        <label>Senha</label>
        <input type="password" v-model="senha" required>
        <button type="submit" :disabled="enviando">Entrar</button>
      </form>
      <p class="aviso">
        Usuarios de teste (criados pelo seed.js):<br>
        admin@teste.com / admin123 (perfil admin)<br>
        usuario@teste.com / user123 (perfil usuario)
      </p>
    </div>
  </script>

  <!-- Rota Admin (pagina pai das rotas Inicial, Objeto e Usuarios) -->
  <script type="text/x-template" id="tpl-admin">
    <div>
      <h2>Administracao</h2>
      <nav class="subnav">
        <router-link :to="{ name: 'admin-inicial' }">Inicial</router-link>
        <router-link :to="{ name: 'admin-objeto' }">Tarefas</router-link>
        <router-link :to="{ name: 'admin-usuarios' }">Usuarios</router-link>
      </nav>
      <router-view></router-view>
    </div>
  </script>

  <!-- Rota Admin / Inicial: resumo -->
  <script type="text/x-template" id="tpl-admin-inicial">
    <div class="card">
      <h3>Resumo do sistema</h3>
      <div v-if="erro" class="erro">{{ erro }}</div>
      <p v-if="carregando" class="aviso">Carregando...</p>
      <div v-else class="resumo">
        <div><strong>{{ tarefas.length }}</strong><span>tarefas</span></div>
        <div><strong>{{ pendentes }}</strong><span>pendentes</span></div>
        <div><strong>{{ concluidas }}</strong><span>concluidas</span></div>
        <div><strong>{{ usuarios.length }}</strong><span>usuarios</span></div>
      </div>
      <p>
        <router-link :to="{ name: 'admin-objeto' }">Cadastro de tarefas</router-link> |
        <router-link :to="{ name: 'admin-usuarios' }">Cadastro de usuarios</router-link>
      </p>
    </div>
  </script>

  <!-- Rota Admin / Objeto: cadastro de tarefas -->
  <script type="text/x-template" id="tpl-admin-objeto">
    <div>
      <div class="card">
        <h3>{{ editandoId ? 'Editar tarefa ' + editandoId : 'Nova tarefa' }}</h3>
        <div v-if="erro" class="erro">{{ erro }}</div>
        <form @submit.prevent="salvar">
          <label>Titulo</label>
          <input type="text" v-model="titulo" maxlength="120" required>
          <label>Descricao</label>
          <textarea rows="2" v-model="descricao"></textarea>
          <label>Status</label>
          <select v-model="status">
            <option value="pendente">pendente</option>
            <option value="concluida">concluida</option>
          </select>
          <label>Dono</label>
          <select v-model="usuarioId" required>
            <option v-for="u in usuarios" :key="u.id" :value="u.id">{{ u.email }}</option>
          </select>
          <button type="submit" :disabled="enviando">{{ editandoId ? 'Salvar alteracoes' : 'Cadastrar' }}</button>
          <button v-if="editandoId" type="button" class="claro" @click="limparFormulario">Cancelar</button>
        </form>
      </div>

      <div class="card">
        <h3>Todas as tarefas</h3>
        <p v-if="carregando" class="aviso">Carregando...</p>
        <p v-else-if="tarefas.length === 0">Nenhuma tarefa cadastrada.</p>
        <table v-else>
          <thead>
            <tr>
              <th>Codigo</th>
              <th>Titulo</th>
              <th>Dono</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="tarefa in tarefas" :key="tarefa.id">
              <td>{{ tarefa.id }}</td>
              <td>{{ tarefa.titulo }}</td>
              <td>{{ tarefa.usuarioEmail }}</td>
              <td><span class="tag" :class="tarefa.status">{{ tarefa.status }}</span></td>
              <td class="acoes">
                <router-link :to="{ name: 'detalhes', params: { id: tarefa.id } }">Detalhes</router-link>
                <button type="button" class="claro" @click="editar(tarefa)">Editar</button>
                <button type="button" class="perigo" @click="excluir(tarefa)">Excluir</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </script>

  <!-- Rota Admin / Usuarios: cadastro de usuarios -->
  <script type="text/x-template" id="tpl-admin-usuarios">
    <div>
      <div class="card">
        <h3>{{ editandoId ? 'Editar usuario ' + editandoId : 'Novo usuario' }}</h3>
        <div v-if="erro" class="erro">{{ erro }}</div>
        <form @submit.prevent="salvar">
          <label>E-mail</label>
          <input type="email" v-model="email" required>
          <label>{{ editandoId ? 'Nova senha (deixe em branco para manter a atual)' : 'Senha' }}</label>
          <input type="password" v-model="senha" :required="!editandoId">
          <label>Perfil</label>
          <select v-model="perfil">
            <option value="usuario">usuario</option>
            <option value="admin">admin</option>
          </select>
          <button type="submit" :disabled="enviando">{{ editandoId ? 'Salvar alteracoes' : 'Cadastrar' }}</button>
          <button v-if="editandoId" type="button" class="claro" @click="limparFormulario">Cancelar</button>
        </form>
      </div>

      <div class="card">
        <h3>Usuarios cadastrados</h3>
        <p v-if="carregando" class="aviso">Carregando...</p>
        <table v-else>
          <thead>
            <tr>
              <th>Codigo</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="u in usuarios" :key="u.id">
              <td>{{ u.id }}</td>
              <td>{{ u.email }}</td>
              <td><span class="tag" :class="u.perfil">{{ u.perfil }}</span></td>
              <td class="acoes">
                <button type="button" class="claro" @click="editar(u)">Editar</button>
                <button type="button" class="perigo" @click="excluir(u)">Excluir</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </script>

  <!-- Rota Autor -->
  <script type="text/x-template" id="tpl-autor">
    <div class="card">
      <h2>Autor</h2>
      <p><strong>Nome:</strong> Daniel da Silva Xavier</p>
      <p><strong>Curso:</strong> Informatica para Internet</p>
      <p><strong>Disciplina:</strong> Desenvolvimento Web 3</p>
      <p><strong>Projeto:</strong> Gerenciador de Tarefas como Aplicacao de Pagina Unica (SPA), feito com Node.js, Express, Sequelize, MariaDB, Vue e Vue Router.</p>
    </div>
  </script>

  <script type="text/x-template" id="tpl-nao-encontrada">
    <div class="card">
      <h2>Pagina nao encontrada</h2>
      <p><router-link :to="{ name: 'inicial' }">Voltar para o inicio</router-link></p>
    </div>
  </script>

  <script src="/vendor/vue.js"></script>
  <script src="/vendor/vue-router.js"></script>
  <script src="/js/estado.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/paginas/inicial.js"></script>
  <script src="/js/paginas/detalhes.js"></script>
  <script src="/js/paginas/login.js"></script>
  <script src="/js/paginas/admin.js"></script>
  <script src="/js/paginas/autor.js"></script>
  <script src="/js/rotas.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
